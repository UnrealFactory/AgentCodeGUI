<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>tauri-glass</title>
<style>
  /* 제품(src/renderer/src/styles.css)의 유리 구조를 그대로 옮긴 것.
     핵심: .sidebar는 **자체 배경이 없다** — body의 --panel 틴트가 아크릴 위에 얹힌다.
     본문(.chat)만 --chat-bg로 한 겹 더. 그래서 아크릴이 꺼지면 사이드바가 통째로
     "DWM 폴백 회색 × 0.3 + 21 × 0.7"이 되어 진한 회색 덩어리로 보인다. */
  :root{
    --panel:   rgba(21,21,21,.70);
    --chat-bg: rgba(16,16,16,.70);
    --line:    rgba(255,255,255,.07);
    --text:    rgba(255,255,255,.90);
    --text-2:  rgba(255,255,255,.62);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    background: var(--panel);
    color: var(--text);
    overflow:hidden; display:flex;
  }
  /* (b)안 — 급변을 '의도된 미묘한 변화'로: 틴트만 부드럽게 갈아끼운다 */
  body.xfade, body.xfade .chat{ transition: background .28s cubic-bezier(.2,.8,.2,1); }

  .sidebar{ width:242px; flex:0 0 auto; padding:10px 8px; display:flex; flex-direction:column; gap:8px; }
  .sb-top{ display:flex; align-items:center; gap:8px; padding:5px 8px 10px; }
  .mark{ width:23px; height:23px; border-radius:7px; background:rgba(255,255,255,.14); }
  .name{ font-size:11.5px; font-weight:600; color:var(--text-2); }
  .row{ padding:7px 9px; border-radius:8px; font-size:12px; color:var(--text-2); background:rgba(255,255,255,.03); }
  .spacer{ flex:1; }        /* 표본점(사이드바 62% 높이)이 비어 있어야 계측이 깨끗하다 */
  .chat{ flex:1; min-width:0; background:var(--chat-bg); position:relative; }
  .hd{ height:52px; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 16px; }
  .tag{ font-size:13px; letter-spacing:.02em; }
  .st{ position:absolute; left:16px; bottom:14px; font:12px/1.7 ui-monospace,Consolas,monospace; color:var(--text-2); white-space:pre; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="sb-top"><div class="mark"></div><div class="name">AgentCodeGUI</div></div>
    <div class="row">새 채팅</div>
    <div class="row">멀티 채팅</div>
    <div class="spacer"></div>
  </aside>
  <main class="chat">
    <div class="hd"><span class="tag" id="tag">tauri-glass</span></div>
    <div class="st" id="st">waiting…</div>
  </main>
<script>
  const $tag = document.getElementById('tag'), $st = document.getElementById('st')
  const root = document.documentElement.style

  function apply(s){
    document.body.classList.toggle('xfade', s.css === 'xfade')
    const effectsOff = !s.transparency || s.batterySaver

    if (s.fallback === 'designed' && effectsOff){
      // (d)안 — 재질이 없는 환경: 반투명 틴트를 폴백 회색 위에 얹으면 "고장난 회색
      // 덩어리"가 된다. 재질이 없다는 걸 **알면** 디자인된 불투명 면으로 갈아탄다.
      root.setProperty('--panel', 'linear-gradient(180deg,#191a1d 0%,#141518 62%,#111215 100%)')
      root.setProperty('--chat-bg', 'linear-gradient(180deg,#121316 0%,#0e0f12 100%)')
    } else if (s.css === 'xfade' && !s.focused){
      root.setProperty('--panel', 'rgba(24,24,26,.58)')
      root.setProperty('--chat-bg', 'rgba(18,18,20,.58)')
    } else {
      root.setProperty('--panel', 'rgba(21,21,21,.70)')
      root.setProperty('--chat-bg', 'rgba(16,16,16,.70)')
    }
    $tag.textContent = s.tag
    $st.textContent = [
      'focused       ' + s.focused,
      'mat/fix       ' + s.mat + ' / ' + s.fix,
      'css/fallback  ' + s.css + ' / ' + s.fallback,
      'transparency  ' + s.transparency,
      'batterySaver  ' + s.batterySaver
    ].join('\n')
  }
  window.__TAURI__.event.listen('glass', (e) => apply(e.payload))
</script>
</body>
</html>
