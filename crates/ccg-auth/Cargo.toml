[package]
name = "ccg-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AgentCodeGUI 계정 도메인 — accounts.json(v3/v2)·codex-accounts.json(v1) 스토어, 격리 CONFIG_DIR 물질화, 토큰 진단·한도 조회 조립"

[features]
# 진단 프로브 전용 바이너리(리포트·크리틱 재현용). 기본 빌드에는 안 들어간다 —
# 앱 번들에 CLI가 딸려 나갈 이유가 없다(ccg-store의 `cli`와 같은 규약).
cli = ["net"]
# ★M11 — **실 HTTP 실행기**(`src/net.rs`). 기본은 꺼짐이고, 그게 이 크레이트의
# 안전장치다: `cargo test -p ccg-auth`는 이 피처 없이 돌아 사용자 실계정에
# **구조적으로** 닿을 수 없다(M5 R1 §1.2가 세운 성질을 그대로 유지한다).
# 켜는 곳은 `src-tauri` 하나뿐이고, 켜도 `CCG_NO_NET=1`이면 전 호출이 즉시 거절된다.
net = ["dep:ureq", "dep:native-tls"]

[[bin]]
name = "ccg-auth-probe"
path = "src/bin/ccg_auth_probe.rs"
required-features = ["cli"]

# ★최종 파리티 T1 — 가짜 `claude` 실행 파일(로그인/상태/로그아웃 계약면만 흉내).
# `auth:login` 배선은 자식 프로세스가 있어야 밟히는데 진짜 CLI를 부르면 브라우저가
# 열리고 사용자 실계정이 걸린다. 기본 빌드에는 안 들어간다(probe와 같은 규약).
[[bin]]
name = "ccg-fake-claude"
path = "src/bin/ccg_fake_claude.rs"
required-features = ["cli"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# OSCrypt(safeStorage) 복호/암호와 앱 홈 경로·원자 저장은 ccg-store 것을 **그대로 쓴다**.
# 같은 스킴을 두 벌 두면 한쪽만 고쳐지는 순간 사용자가 재로그인을 하게 된다(R8에서 v10
# 쓰기까지 실측 검증된 코드 = crates/ccg-store/src/safe_storage.rs가 단일 소스다).
ccg-store = { path = "../ccg-store" }
# 토큰 지문(sha256 앞 12자) — 스냅샷 오염 진단의 판정 키. api_config.rs와 같은 레시피.
sha2 = "0.10"
# ★M11 — 한도 조회 실행기(`net` 피처에서만). **동기** 클라이언트라야 한다:
# 부르는 자리가 전용 워커 스레드 하나이고(허브가 아니다 — `engine/acct_switch.rs`),
# 그 스레드에 async 런타임을 하나 더 띄우면 상주 메모리가 그만큼 는다. reqwest는
# blocking 피처조차 내부에 tokio 멀티스레드 런타임을 세운다 — 그래서 ureq다.
# default-features를 끄고 TLS 하나만 켠다: gzip/json/cookies는 이 크레이트가 안 쓰고
# (파싱은 usage.rs가 한다) 전부 바이너리 크기다.
#
# ★R2 — rustls + **번들 루트 인증서** 대신 OS 스토어(schannel)를 쓴다. R1 크리틱이 같은
# 커밋에서 실측한 값이 근거다: 앱 바이너리 **−890,880 B**(M11 비용 +1.11MB → +0.22MB).
# 인증서 신선도도 OS가 맡는다(번들은 앱을 새로 내야 갱신된다).
# 대가 하나: schannel은 Windows 루트 저장소를 믿으므로 사내 MITM 프록시의 루트도
# 신뢰하게 된다(rustls 번들은 거절했다). 이 앱은 Windows 전용이고 그 환경의 사용자에게는
# 그게 기능이다 — 그래도 선택은 선택이라 여기 적어 둔다.
ureq = { version = "2.12", default-features = false, features = ["native-tls"], optional = true }
native-tls = { version = "0.2", optional = true }

# 계정 폴더의 공유 정션(projects·sessions…) — **정션이어야 resume이 산다**(심링크는
# 개발자 모드/관리자 권한이 필요해 사용자 머신에서 조용히 실패한다). Node는
# fs.symlinkSync(..., 'junction')로 이걸 해줬고, Rust std에는 대응물이 없어
# FSCTL_SET_REPARSE_POINT를 직접 쓴다(src/junction.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  # 존 표기가 없는 ISO 시각을 JS `Date.parse`처럼 **로컬시**로 읽는다(src/js.rs).
  # DST 규칙까지 OS에 물어봐야 KST 밖에서도 맞다. 새 패키지가 아니라 기능 하나 추가다.
  "Win32_System_Time",
] }
