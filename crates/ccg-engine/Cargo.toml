[package]
name = "ccg-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AgentCodeGUI 3.0 엔진 코어 — RunIdentity · 상태기계(60전이) · 라이브 원장 · claude.exe 드라이버"

[features]
# 하네스 전용 가짜 CLI(`scripts/poc-live-chat.mjs --only=dialog`가 부른다).
# 기본 빌드에는 없다 — 앱 번들에 스텁이 딸려 나갈 이유가 없다(ccg-store의 `cli`와 같은 규약).
fakecli = []

[[bin]]
name = "ccg-fakecli"
path = "src/bin/ccg_fakecli.rs"
required-features = ["fakecli"]

# 가짜 `codex app-server`(M4). 같은 규약 — 기본 빌드에는 없다.
[[bin]]
name = "ccg-fakecodex"
path = "src/bin/ccg_fakecodex.rs"
required-features = ["fakecli"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# 정체성 해시. 설계(§2.2)는 blake3를 적었지만 이 환경의 레지스트리 캐시에 blake3가 없다
# (오프라인 빌드). sha2는 워크스페이스 Cargo.lock에 이미 있어 추가 네트워크가 필요 없다.
# 성질(정준 직렬화 → 안정 해시 앞 16바이트)은 동일하고, 알고리즘 교체는 canon.rs 한 곳이다.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# job object(KILL_ON_JOB_CLOSE) — 앱이 죽으면 claude.exe(337MB)와 손자까지 커널이 거둔다.
# docs/critic/m3-poc.md §4에서 4행 대조로 실증된 유일한 좀비 차단 수단이라 최초 커밋에 넣는다.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
